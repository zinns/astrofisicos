name: PR Metadata

on:
  pull_request:
    branches:
      - develop
      - release
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review
      - review_requested
      - review_request_removed

permissions:
  contents: read
  pull-requests: read

jobs:
  branch-name:
    name: Branch Name
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate branch name
        run: node ./scripts/validate-branch-name.mjs --branch "$PR_HEAD_REF"
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}

  pr-title:
    name: PR Title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate PR title
        run: node ./scripts/validate-pr.mjs --check title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}
          PR_APPROVAL_COUNT: "0"

  issue-reference:
    name: Issue Reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate issue reference
        run: node ./scripts/validate-pr.mjs --check issue-reference
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}
          PR_APPROVAL_COUNT: "0"

  labels:
    name: Labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate labels
        run: node ./scripts/validate-pr.mjs --check labels
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}
          PR_APPROVAL_COUNT: "0"

  approval:
    name: Approval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: approvals
        uses: actions/github-script@v7
        with:
          script: |
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const latestStateByUser = new Map();

            for (const review of reviews) {
              latestStateByUser.set(review.user.login, review.state);
            }

            const approvalCount = [...latestStateByUser.values()].filter((state) => state === "APPROVED").length;
            core.setOutput("count", String(approvalCount));
      - name: Validate approval state
        run: node ./scripts/validate-pr.mjs --check approval
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}
          PR_APPROVAL_COUNT: ${{ steps.approvals.outputs.count }}
