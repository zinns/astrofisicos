name: PR Metadata

on:
  pull_request:
    branches:
      - develop
      - release
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  branch-name:
    name: Branch Name
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
      - name: Validate branch name
        run: node ./scripts/validate-branch-name.mjs --branch "$PR_HEAD_REF"
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}

  pr-title:
    name: PR Title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
      - name: Validate PR title
        run: node ./scripts/validate-pr.mjs --check title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}

  issue-reference:
    name: Issue Reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
      - name: Validate issue reference
        run: node ./scripts/validate-pr.mjs --check issue-reference
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}

  develop-sync-gate:
    name: Develop Sync Gate
    if: github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
      - name: Find open release sync PR
        id: sync-pr
        uses: actions/github-script@v7
        with:
          script: |
            const releaseMetadataSyncBranchPattern = /^ci\/\d+-release-metadata-sync$/;
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              base: "develop",
              per_page: 100,
            });

            const syncPr = pulls.find(
              (pr) =>
                (pr.head.ref === "main" ||
                  releaseMetadataSyncBranchPattern.test(pr.head.ref)) &&
                pr.number !== context.payload.pull_request.number,
            );

            core.setOutput(
              "open_sync_pr_number",
              syncPr ? String(syncPr.number) : "",
            );
      - name: Validate develop sync gate
        run: node ./scripts/validate-pr.mjs --check develop-sync-gate
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}
          PR_OPEN_DEVELOP_SYNC_NUMBER: ${{ steps.sync-pr.outputs.open_sync_pr_number }}

  labels:
    name: Labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
      - name: Validate labels
        run: node ./scripts/validate-pr.mjs --check labels
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}
