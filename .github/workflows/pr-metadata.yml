name: PR Metadata

on:
  pull_request:
    branches:
      - develop
      - release
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review
      - review_requested
      - review_request_removed

permissions:
  contents: read
  pull-requests: read

jobs:
  branch-name:
    name: Branch Name
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate branch name
        run: node ./scripts/validate-branch-name.mjs --branch "$PR_HEAD_REF"
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}

  pr-title:
    name: PR Title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate PR title
        run: node ./scripts/validate-pr.mjs --check title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}

  issue-reference:
    name: Issue Reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate issue reference
        run: node ./scripts/validate-pr.mjs --check issue-reference
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}

  labels:
    name: Labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate labels
        run: node ./scripts/validate-pr.mjs --check labels
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}
