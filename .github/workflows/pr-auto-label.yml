name: PR Auto Label

on:
  pull_request:
    branches:
      - develop
      - release
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-auto-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apply-labels:
    name: Apply Labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Derive labels
        id: derive
        run: |
          LABELS=$(PR_TITLE="$PR_TITLE" PR_BASE_REF="$PR_BASE_REF" PR_HEAD_REF="$PR_HEAD_REF" node --input-type=module <<'EOF'
          import { derivePrLabels } from "./scripts/derive-pr-labels.mjs";

          const labels = derivePrLabels({
            title: process.env.PR_TITLE ?? "",
            baseRef: process.env.PR_BASE_REF ?? "",
            headRef: process.env.PR_HEAD_REF ?? "",
          });

          process.stdout.write(JSON.stringify(labels));
          EOF
          )
          echo "labels=${LABELS}" >> "$GITHUB_OUTPUT"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      - name: Apply labels
        if: steps.derive.outputs.labels != '[]'
        uses: actions/github-script@v7
        env:
          LABELS_JSON: ${{ steps.derive.outputs.labels }}
        with:
          script: |
            const labels = JSON.parse(process.env.LABELS_JSON);

            if (labels.length === 0) {
              return;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels,
            });
