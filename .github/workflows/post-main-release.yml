name: Post Main Release

on:
  pull_request_target:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: post-main-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  post-main-release:
    name: Post Main Release
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Finalize Git tag, release, and tracking issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node ./scripts/release-automation.mjs finalize-main-release
